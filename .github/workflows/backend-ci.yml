name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'Backend/**'
      - 'docker-compose.yml'

jobs:
  build:
    uses: ./.github/workflows/build.yml

  discover:
    runs-on: self-hosted
    outputs:
      tests: ${{ steps.find.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          tests=$(find tests/integration -name "test.http" -exec dirname {} \; | sed 's|tests/integration/||' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "tests=$tests" >> $GITHUB_OUTPUT

  integration:
    name: ${{ replace(matrix.test, '/', '-') }}
    needs: [build, discover]
    strategy:
      matrix:
        test: ${{ fromJson(needs.discover.outputs.tests) }}
    uses: ./.github/workflows/integration-test.yml
    with:
      test_path: tests/integration/${{ matrix.test }}
