name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'Backend/**'
      - 'docker-compose.yml'

jobs:
  build:
    uses: ./.github/workflows/build.yml

  discover:
    runs-on: self-hosted
    outputs:
      tests: ${{ steps.find.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          tests=$(find tests/integration -name "test.http" -exec dirname {} \; \
            | sed 's|tests/integration/||' | sort \
            | while read path; do
                name=$(echo "$path" | tr '/' '-')
                echo "{\"path\":\"$path\",\"name\":\"$name\"}"
              done | paste -sd ',' | sed 's/.*/[&]/')
          echo "tests=$tests" >> $GITHUB_OUTPUT

  integration:
    name: ${{ matrix.config.name }}
    needs: [build, discover]
    strategy:
      matrix:
        config: ${{ fromJson(needs.discover.outputs.tests) }}
    uses: ./.github/workflows/integration-test.yml
    with:
      test_path: tests/integration/${{ matrix.config.path }}
