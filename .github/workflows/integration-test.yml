name: Integration Test

on:
  workflow_call:
    inputs:
      test_path:
        type: string
        required: true
      name:
        type: string
        required: true

jobs:
  test:
    name: ${{ inputs.name }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Set project name
        run: echo "PROJECT=ci-$(echo '${{ inputs.test_path }}' | tr '/.' '-')-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Start services
        run: docker compose -p $PROJECT up --no-build -d postgres-db backend

      - name: Wait for backend
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/ && exit 0
            sleep 2
          done
          exit 1

      - name: Seed
        run: |
          docker compose -p $PROJECT exec -T postgres-db \
            sh -c 'psql -U $POSTGRES_USER -d $POSTGRES_DB' \
            < tests/integration/seed.sql

      - name: Request
        run: |
          set -o pipefail
          httpyac send ${{ inputs.test_path }}/test.http --all \
            | tee >(awk '/^[{[]$/{p=1} p{print} /^[}\]]$/{p=0}' > /tmp/response.json)

      - name: Detect checks
        id: checks
        run: |
          [ -f "${{ inputs.test_path }}/expected.json" ] && echo "json=true" >> $GITHUB_OUTPUT || echo "json=false" >> $GITHUB_OUTPUT
          [ -f "${{ inputs.test_path }}/verify.sql" ] && echo "sql=true" >> $GITHUB_OUTPUT || echo "sql=false" >> $GITHUB_OUTPUT

      - name: Check JSON
        if: steps.checks.outputs.json == 'true'
        run: diff <(jq -S . /tmp/response.json) <(jq -S . ${{ inputs.test_path }}/expected.json)

      - name: Check PostgreSQL
        if: steps.checks.outputs.sql == 'true'
        run: |
          docker compose -p $PROJECT exec -T postgres-db \
            sh -c 'psql -U $POSTGRES_USER -d $POSTGRES_DB' \
            < ${{ inputs.test_path }}/verify.sql

      - name: Backend logs
        if: failure()
        run: docker compose -p $PROJECT logs backend

      - name: Stop services
        if: always()
        run: docker compose -p $PROJECT down -v
