x-urls:
  backend: &backend-url "http://${BACKEND_HOST:-localhost}:${BACKEND_PORT:-8080}"
  frontend: &frontend-url "http://${FRONTEND_HOST:-localhost}:${FRONTEND_PORT:-3000}"

services:
  postgres-db:
    image: postgres:15.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - backend

  backend:
    image: tasktracker-backend
    build:
      context: ./Backend
    environment:
      ConnectionStrings__DefaultConnection: "Host=${POSTGRES_HOST:-postgres-db};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      CORS_ORIGIN: *frontend-url
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - backend

  frontend:
    image: tasktracker-frontend
    build:
      context: ./Frontend
      args:
        VITE_API_URL: *backend-url
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
